name: WarPick01
voxelsPerUnit: 8
assemblyOrigin:
  part: WarPick
parts:
  - part: WarPick
    pivot: [1, 5, 4]
    voxels:
      # Semantic Forward / pick/striking direction is source -Y -> Unity -Z.
      - box: { min: [0, 4, 1], size: [2, 1, 8], color: wood.mid }
      - box: { min: [0, 5, 1], size: [1, 1, 8], color: wood.dark }
      - box: { min: [0, 4, 3], size: [2, 2, 2], color: leather }
      - box: { min: [0, 4, 0], size: [2, 2, 1], color: steel }
      - box: { min: [0, 4, 8], size: [2, 2, 2], color: iron.mid }
      - box: { min: [0, 0, 9], size: [2, 4, 2], color: iron.mid }
      - box: { min: [0, 0, 10], size: [2, 1, 1], color: bone.mid }
      - box: { min: [1, 0, 9], size: [1, 1, 2], color: bone.dark }
      - box: { min: [0, 6, 9], size: [2, 3, 2], color: iron.dark }
      - box: { min: [0, 9, 9], size: [2, 1, 2], color: iron.light }
      - box: { min: [0, 4, 11], size: [2, 2, 1], color: iron.mid }
sockets:
  - socket: Mount
    parent: WarPick
    transform:
      translate: [1, 5, 4]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: WarPick
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: WarPick
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: WarPick
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, 68]
            - time: 1
              value: [0, 0, 12.24]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: WarPick
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: WarPick
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
