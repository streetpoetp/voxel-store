name: Crossbow02
voxelsPerUnit: 8
assemblyOrigin:
  part: Crossbow
parts:
  - part: Crossbow
    pivot: [1, 6, 4]
    voxels:
      # Semantic Forward / projectile launch direction is source -Y -> Unity -Z.
      - box: { min: [0, 1, 4], size: [2, 7, 1], color: wood.mid }
      - box: { min: [0, 3, 3], size: [2, 2, 1], color: wood.dark }
      - box: { min: [0, 0, 4], size: [2, 3, 1], color: steel }
      - box: { min: [0, 7, 4], size: [2, 2, 1], color: wood.light }
      - box: { min: [0, 6, 2], size: [2, 1, 2], color: wood.mid }
      - box: { min: [0, 6, 1], size: [2, 1, 1], color: brass }
      - box: { min: [0, 2, 6], size: [2, 9, 1], color: olive.mid }
      - box: { min: [0, 10, 7], size: [2, 2, 1], color: olive.light }
      - box: { min: [0, 0, 7], size: [2, 2, 1], color: olive.dark }
      - box: { min: [0, 10, 6], size: [1, 1, 1], color: brass }
      - box: { min: [0, 1, 6], size: [1, 1, 1], color: brass }
      - box: { min: [0, 1, 6], size: [1, 10, 1], color: string.red }
      - box: { min: [0, 5, 4], size: [1, 1, 1], color: brass }
sockets:
  - socket: Mount
    parent: Crossbow
    transform:
      translate: [1, 6, 4]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Crossbow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Crossbow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Crossbow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [12, 0, 0]
            - time: 1
              value: [2.16, 0, 0]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Crossbow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Crossbow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
