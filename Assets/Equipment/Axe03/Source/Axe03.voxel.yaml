        - { time: 0.12, value: 1 }
        - { time: 0.22, value: 0 }
        - { time: 0.7, value: 0 }
        - { time: 0.82, value: 0.3 }
        - { time: 0.92, value: 0.72 }
        - { time: 1, value: 1 }
    tracks:
      - part: Axe
        position:
          interpolation: smoothstep
          keys:
