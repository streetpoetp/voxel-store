name: Axe03
voxelsPerUnit: 12
assemblyOrigin:
  part: Axe
parts:
  - part: Axe
    pivot: [2, 10, 6]
    voxels:
      # Semantic Forward / cutting direction is source -Y -> Unity -Z.
      # Walnut haft with explicit rear depth.
      - box: { min: [1, 9, 1], size: [2, 2, 12], color: walnut.mid }
      - box: { min: [1, 9, 1], size: [1, 2, 12], color: walnut.dark }

      # Teal grip and brass butt reinforcement.
      - box: { min: [1, 8, 4], size: [2, 4, 3], color: teal.mid }
      - box: { min: [2, 8, 4], size: [1, 1, 3], color: teal.light }
      - box: { min: [1, 11, 4], size: [1, 1, 3], color: teal.dark }
      - box: { min: [1, 8, 0], size: [2, 4, 1], color: brass.mid }
      - box: { min: [2, 8, 0], size: [1, 1, 1], color: brass.light }
      - box: { min: [1, 11, 0], size: [1, 1, 1], color: brass.dark }

      # Main crescent head: one-voxel-high stepped rows preserve the curved silhouette.
      - box: { min: [0, 5, 17], size: [3, 7, 1], color: steel.mid }
      - box: { min: [0, 3, 16], size: [3, 9, 1], color: steel.mid }
      - box: { min: [0, 2, 15], size: [3, 10, 1], color: steel.mid }
      - box: { min: [0, 1, 14], size: [3, 11, 1], color: steel.mid }
      - box: { min: [0, 1, 13], size: [3, 11, 1], color: steel.mid }
      - box: { min: [0, 2, 12], size: [3, 10, 1], color: steel.mid }
      - box: { min: [0, 4, 11], size: [3, 8, 1], color: steel.mid }

      # Dark side face gives the head readable thickness in three-quarter views.
      - box: { min: [0, 5, 17], size: [1, 7, 1], color: steel.dark }
      - box: { min: [0, 3, 16], size: [1, 9, 1], color: steel.dark }
      - box: { min: [0, 2, 15], size: [1, 10, 1], color: steel.dark }
      - box: { min: [0, 1, 14], size: [1, 11, 1], color: steel.dark }
      - box: { min: [0, 1, 13], size: [1, 11, 1], color: steel.dark }
      - box: { min: [0, 2, 12], size: [1, 10, 1], color: steel.dark }
      - box: { min: [0, 4, 11], size: [1, 8, 1], color: steel.dark }

      # Bright stepped cutting edge and lighter inner bevel.
      - box: { min: [0, 4, 17], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [0, 2, 16], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [0, 1, 15], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [0, 0, 14], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [0, 0, 13], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [0, 1, 12], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [0, 3, 11], size: [3, 1, 1], color: edge.ivory }
      - box: { min: [2, 5, 17], size: [1, 1, 1], color: steel.light }
      - box: { min: [2, 3, 16], size: [1, 1, 1], color: steel.light }
      - box: { min: [2, 2, 15], size: [1, 1, 1], color: steel.light }
      - box: { min: [2, 1, 14], size: [1, 1, 2], color: steel.light }
      - box: { min: [2, 2, 12], size: [1, 1, 1], color: steel.light }
      - box: { min: [2, 4, 11], size: [1, 1, 1], color: steel.light }

      # Narrow neck and compact rounded poll remain subordinate to the blade.
      - box: { min: [0, 12, 14], size: [3, 2, 1], color: steel.mid }
      - box: { min: [0, 12, 13], size: [3, 1, 1], color: steel.mid }
      - box: { min: [0, 12, 15], size: [3, 1, 1], color: steel.mid }
      - box: { min: [0, 14, 15], size: [3, 2, 1], color: steel.mid }
      - box: { min: [0, 13, 14], size: [3, 4, 1], color: steel.mid }
      - box: { min: [0, 14, 13], size: [3, 2, 1], color: steel.mid }
      - box: { min: [0, 14, 15], size: [1, 2, 1], color: steel.dark }
      - box: { min: [0, 13, 14], size: [1, 4, 1], color: steel.dark }
      - box: { min: [0, 14, 13], size: [1, 2, 1], color: steel.dark }
      - box: { min: [2, 14, 14], size: [1, 1, 1], color: steel.light }

      # Brass throat/socket bridges the head into the haft and exposes a steel core.
      - box: { min: [0, 7, 10], size: [3, 6, 4], color: brass.dark }
      - box: { min: [1, 7, 10], size: [2, 6, 4], color: brass.mid }
      - box: { min: [2, 7, 10], size: [1, 1, 4], color: brass.light }
      - box: { min: [0, 9, 11], size: [3, 2, 2], color: steel.dark }

      # Restrained top-face highlight.
      - box: { min: [2, 8, 17], size: [1, 2, 1], color: steel.light }
