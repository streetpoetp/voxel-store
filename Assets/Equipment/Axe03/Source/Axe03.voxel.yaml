    tracks:
      - part: Axe
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.18
              value: [0, 1.5, 0.5]
            - time: 0.55
              value: [0, -8, 1.5]
            - time: 0.82
              value: [0, -10, 0.5]
            - time: 1
              value: [0, 0, 0]
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.18
              value: [0, 0, -18]
            - time: 0.55
