        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
  - clip: Idle.V1
    duration: 1.164
    loop: true
    tracks:
      - part: Axe
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 6.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward.V1
    duration: 0.558
    loop: true
    tracks:
      - part: Axe
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 12]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack.V1
