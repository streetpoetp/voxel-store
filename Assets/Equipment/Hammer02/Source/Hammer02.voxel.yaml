name: Hammer02
voxelsPerUnit: 8
assemblyOrigin:
  part: Hammer
parts:
  - part: Hammer
    pivot: [1, 5, 4]
    voxels:
      # Semantic Forward / striking-face direction is source -Y -> Unity -Z.
      - box: { min: [0, 4, 1], size: [2, 2, 8], color: wood.mid }
      - box: { min: [0, 5, 1], size: [1, 1, 8], color: wood.dark }
      - box: { min: [0, 4, 2], size: [2, 2, 3], color: wrap.orange }
      - box: { min: [1, 4, 2], size: [1, 1, 3], color: wrap.light }
      - box: { min: [0, 4, 0], size: [2, 2, 1], color: copper.mid }
      - box: { min: [0, 3, 8], size: [2, 4, 2], color: copper.mid }
      - box: { min: [1, 3, 8], size: [1, 1, 2], color: copper.light }
      - box: { min: [0, 1, 9], size: [2, 4, 3], color: iron.mid }
      - box: { min: [0, 1, 9], size: [1, 4, 3], color: iron.dark }
      - box: { min: [0, 0, 10], size: [2, 1, 2], color: face.ivory }
      - box: { min: [0, 5, 10], size: [2, 3, 1], color: iron.mid }
      - box: { min: [0, 8, 10], size: [2, 1, 1], color: iron.dark }
      - box: { min: [1, 1, 9], size: [1, 1, 3], color: iron.light }
sockets:
  - socket: Mount
    parent: Hammer
    transform:
      translate: [1, 5, 4]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, 72]
            - time: 1
              value: [0, 0, 12.96]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
  - clip: Idle.V1
    duration: 1.176
    loop: true
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 4.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward.V1
    duration: 0.6
    loop: true
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack.V1
    duration: 0.4275
    loop: false
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, 75]
            - time: 1
              value: [0, 0, 12.96]
  - clip: Hit.V1
    duration: 0.343
    loop: false
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 16]
            - time: 1
              value: [0, 0, 0]
  - clip: Death.V1
    duration: 0.7125
    loop: false
    tracks:
      - part: Hammer
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 85]
