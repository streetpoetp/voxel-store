name: Spear02
voxelsPerUnit: 8
assemblyOrigin:
  part: Spear
parts:
  - part: Spear
    pivot: [4, 10, 1]
    voxels:
      # Semantic Forward / thrust direction toward spear tip is source -Y -> Unity -Z.
      - box: { min: [3, 4, 0], size: [1, 11, 1], color: shaft.mid }
      - box: { min: [4, 4, 1], size: [1, 11, 1], color: shaft.dark }
      - box: { min: [3, 9, 0], size: [2, 3, 1], color: grip.ivory }
      - box: { min: [3, 9, 0], size: [1, 3, 1], color: grip.light }
      - box: { min: [3, 15, 0], size: [2, 1, 1], color: gold.mid }
      - box: { min: [3, 3, 0], size: [2, 2, 1], color: gold.mid }
      - box: { min: [2, 2, 0], size: [3, 2, 2], color: blade.mid }
      - box: { min: [1, 1, 0], size: [5, 1, 2], color: blade.mid }
      - box: { min: [2, 0, 0], size: [3, 1, 2], color: blade.mid }
      - box: { min: [3, 0, 0], size: [1, 1, 2], color: blade.light }
      - box: { min: [1, 1, 0], size: [1, 1, 2], color: edge.ivory }
      - box: { min: [2, 0, 0], size: [1, 1, 2], color: edge.ivory }
sockets:
  - socket: Mount
    parent: Spear
    transform:
      translate: [4, 10, 1]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Spear
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Spear
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Spear
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [28, 0, 0]
            - time: 1
              value: [5.04, 0, 0]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Spear
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Spear
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
