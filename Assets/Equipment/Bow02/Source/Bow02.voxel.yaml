sockets:
  - socket: Mount
    parent: Bow
    transform:
      translate: [6, 4, 48]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Bow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Bow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Bow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, -10]
            - time: 1
              value: [0, 0, -1.8]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Bow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Bow
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
