name: Mace02
voxelsPerUnit: 8
assemblyOrigin:
  part: Mace
parts:
  - part: Mace
    pivot: [4, 8, 1]
    voxels:
      # Semantic Forward / leading head/strike direction is source -Y -> Unity -Z.
      - box: { min: [4, 3, 0], size: [1, 8, 2], color: ash.mid }
      - box: { min: [4, 3, 1], size: [1, 8, 1], color: ash.dark }
      - box: { min: [4, 8, 0], size: [1, 2, 2], color: cyan.mid }
      - box: { min: [4, 8, 0], size: [1, 2, 1], color: cyan.light }
      - box: { min: [3, 11, 0], size: [3, 1, 2], color: brass.mid }
      - box: { min: [4, 2, 0], size: [1, 1, 2], color: brass.dark }
      - box: { min: [3, 1, 0], size: [3, 2, 2], color: mace.mid }
      - box: { min: [3, 0, 0], size: [3, 3, 2], color: mace.mid }
      - box: { min: [2, 1, 0], size: [1, 1, 2], color: mace.dark }
      - box: { min: [6, 1, 0], size: [1, 1, 2], color: mace.dark }
      - box: { min: [4, 0, 0], size: [1, 1, 2], color: mace.light }
      - box: { min: [4, 2, 0], size: [1, 1, 2], color: mace.dark }
      - box: { min: [3, 1, 0], size: [3, 1, 1], color: brass.mid }
      - box: { min: [4, 0, 0], size: [1, 1, 1], color: brass.light }
sockets:
  - socket: Mount
    parent: Mace
    transform:
      translate: [4, 8, 1]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Mace
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Mace
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Mace
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, 62]
            - time: 1
              value: [0, 0, 11.16]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Mace
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Mace
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
