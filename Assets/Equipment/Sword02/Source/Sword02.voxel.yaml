            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 9.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward.V1
    duration: 0.588
    loop: true
    tracks:
      - part: Sword
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 8]
