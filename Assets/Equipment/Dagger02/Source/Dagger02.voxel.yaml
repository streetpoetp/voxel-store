name: Dagger02
voxelsPerUnit: 10
assemblyOrigin:
  part: Dagger
parts:
  - part: Dagger
    pivot: [2, 10, 1]
    voxels:
      # Semantic Forward / thrust direction from grip toward blade tip is source -Y -> Unity -Z.
      - box: { min: [1, 11, 1], size: [2, 1, 1], color: purple.mid }
      - box: { min: [1, 10, 0], size: [1, 1, 1], color: cyan.mid }
      - box: { min: [1, 9, 1], size: [2, 2, 1], color: grip.dark }
      - box: { min: [1, 9, 0], size: [2, 1, 1], color: gold.mid }
      - box: { min: [1, 8, 0], size: [2, 1, 1], color: purple.mid }
      - box: { min: [0, 7, 1], size: [4, 1, 1], color: purple.mid }
      - box: { min: [0, 6, 0], size: [1, 1, 1], color: gold.mid }
      - box: { min: [3, 6, 0], size: [1, 1, 1], color: gold.mid }
      - box: { min: [1, 6, 0], size: [1, 1, 1], color: cyan.mid }
      - box: { min: [3, 6, 0], size: [1, 1, 1], color: cyan.mid }
      - box: { min: [1, 4, 1], size: [3, 4, 1], color: blade.mid }
      - box: { min: [1, 2, 1], size: [2, 2, 1], color: blade.mid }
      - box: { min: [1, 1, 1], size: [2, 1, 1], color: blade.mid }
      - box: { min: [2, 0, 1], size: [1, 1, 1], color: blade.light }
      - box: { min: [1, 5, 0], size: [1, 2, 1], color: purple.mid }
      - box: { min: [1, 4, 0], size: [1, 1, 1], color: gold.mid }
      - box: { min: [1, 2, 0], size: [1, 1, 1], color: purple.mid }
      - box: { min: [1, 0, 0], size: [1, 1, 1], color: gold.mid }
      - box: { min: [2, 2, 0], size: [1, 4, 1], color: cyan.mid }
      - box: { min: [1, 5, 0], size: [1, 1, 1], color: accent.blue }
      - box: { min: [3, 3, 0], size: [1, 1, 1], color: accent.blue }
sockets:
  - socket: Mount
    parent: Dagger
    transform:
      translate: [2, 10, 1]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Dagger
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Dagger
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Dagger
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, -38]
            - time: 1
              value: [0, 0, -6.84]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Dagger
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Dagger
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
