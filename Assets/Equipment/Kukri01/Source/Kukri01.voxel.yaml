name: Kukri01
voxelsPerUnit: 8
assemblyOrigin:
  part: Kukri
parts:
  - part: Kukri
    pivot: [4, 9, 1]
    voxels:
      # Semantic Forward / leading blade-tip/chop direction is source -Y -> Unity -Z.
      - box: { min: [4, 9, 0], size: [1, 3, 2], color: green.mid }
      - box: { min: [4, 9, 1], size: [1, 3, 1], color: green.dark }
      - box: { min: [4, 9, 0], size: [1, 2, 1], color: green.light }
      - box: { min: [3, 8, 0], size: [3, 1, 2], color: brass.mid }
      - box: { min: [3, 7, 0], size: [3, 1, 2], color: blade.mid }
      - box: { min: [2, 5, 0], size: [4, 2, 2], color: blade.mid }
      - box: { min: [2, 3, 0], size: [5, 2, 2], color: blade.mid }
      - box: { min: [2, 2, 0], size: [5, 1, 2], color: blade.mid }
      - box: { min: [3, 1, 0], size: [5, 1, 2], color: blade.dark }
      - box: { min: [5, 0, 0], size: [3, 1, 2], color: blade.dark }
      - box: { min: [2, 4, 0], size: [1, 3, 2], color: edge.ivory }
      - box: { min: [2, 2, 0], size: [1, 2, 2], color: edge.ivory }
      - box: { min: [3, 1, 0], size: [1, 1, 2], color: edge.ivory }
      - box: { min: [3, 0, 1], size: [4, 8, 1], color: blade.dark }
      - box: { min: [3, 8, 0], size: [1, 1, 1], color: brass.light }
sockets:
  - socket: Mount
    parent: Kukri
    transform:
      translate: [4, 9, 1]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Kukri
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Kukri
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Kukri
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [0, 0, -52]
            - time: 1
              value: [0, 0, -9.36]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Kukri
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Kukri
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
