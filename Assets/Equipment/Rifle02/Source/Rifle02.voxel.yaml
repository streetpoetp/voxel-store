name: Rifle02
voxelsPerUnit: 8
assemblyOrigin:
  part: Rifle
parts:
  - part: Rifle
    pivot: [1, 8, 4]
    voxels:
      # Semantic Forward / projectile launch direction is source -Y -> Unity -Z.
      - box: { min: [0, 5, 5], size: [2, 5, 1], color: metal.mid }
      - box: { min: [1, 5, 5], size: [1, 5, 1], color: metal.dark }
      - box: { min: [0, 9, 4], size: [2, 5, 2], color: birch.mid }
      - box: { min: [0, 13, 5], size: [2, 1, 2], color: birch.light }
      - box: { min: [0, 10, 3], size: [2, 2, 2], color: birch.dark }
      - box: { min: [0, 7, 2], size: [2, 1, 3], color: metal.dark }
      - box: { min: [0, 1, 5], size: [1, 4, 1], color: copper.mid }
      - box: { min: [0, 0, 6], size: [1, 5, 1], color: metal.dark }
      - box: { min: [0, 0, 6], size: [1, 1, 1], color: red }
      - box: { min: [0, 6, 6], size: [1, 1, 1], color: metal.light }
      - box: { min: [0, 4, 5], size: [1, 1, 1], color: copper.dark }
sockets:
  - socket: Mount
    parent: Rifle
    transform:
      translate: [1, 8, 4]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Rifle
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Rifle
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Rifle
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [14, 0, 0]
            - time: 1
              value: [2.52, 0, 0]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Rifle
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Rifle
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
