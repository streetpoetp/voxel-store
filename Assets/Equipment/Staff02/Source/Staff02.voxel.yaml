name: Staff02
voxelsPerUnit: 8
assemblyOrigin:
  part: Staff
parts:
  - part: Staff
    pivot: [4, 10, 1]
    voxels:
      # Semantic Forward / leading staff-head direction is source -Y -> Unity -Z.
      - box: { min: [3, 3, 0], size: [1, 13, 1], color: wood.mid }
      - box: { min: [4, 3, 1], size: [1, 13, 1], color: wood.dark }
      - box: { min: [3, 13, 0], size: [2, 1, 1], color: bronze }
      - box: { min: [3, 4, 0], size: [2, 1, 1], color: jade.mid }
      - box: { min: [3, 4, 0], size: [1, 1, 1], color: jade.light }
      - box: { min: [2, 1, 0], size: [1, 3, 2], color: wood.mid }
      - box: { min: [4, 1, 0], size: [2, 3, 2], color: wood.mid }
      - box: { min: [2, 0, 0], size: [1, 1, 2], color: wood.light }
      - box: { min: [5, 0, 0], size: [1, 1, 2], color: wood.light }
      - box: { min: [3, 0, 0], size: [1, 2, 2], color: stone.mid }
      - box: { min: [4, 0, 0], size: [1, 1, 1], color: stone.light }
sockets:
  - socket: Mount
    parent: Staff
    transform:
      translate: [4, 10, 1]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Staff
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 1.5]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Staff
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 5]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Staff
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.55
              value: [22, 0, 0]
            - time: 1
              value: [3.96, 0, 0]
  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Staff
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 0, 10]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Staff
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
