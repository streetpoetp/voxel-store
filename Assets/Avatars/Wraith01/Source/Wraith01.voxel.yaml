sockets:
  - socket: Equip.Hand.Left.0
    parent: Body
    transform:
      translate: [1, 2, 4]
  - socket: Equip.Hand.Right.0
    parent: Body
    transform:
      translate: [12, 2, 4]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 0.2]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward
    duration: 0.6
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.33
              value: [0, -0.6, 1.2]
            - time: 0.66
              value: [0, -1.2, 0]
            - time: 1
              value: [0, 0, 0]
  - clip: Attack
    duration: 0.45
    loop: false
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
