name: CultistAcolyte01
voxelsPerUnit: 8
assemblyOrigin:
  part: Body
parts:
  - part: Body
    voxels:
      - box: { min: [1, 1, 8], size: [7, 4, 3], color: robeLight }
      - box: { min: [2, 1, 3], size: [5, 4, 6], color: robe }
      - box: { min: [1, 1, 0], size: [7, 4, 4], color: robeDark }
      - box: { min: [3, 0, 3], size: [2, 1, 4], color: belt }
      - voxel: { at: [4, 0, 6], color: glow }
  - part: Head
    parent: Body
    transform:
      translate: [2, 0, 10]
    voxels:
      - box: { min: [0, 0, 0], size: [5, 5, 5], color: robeDark }
      - box: { min: [1, 0, 1], size: [3, 1, 3], color: skin }
      - box: { min: [0, 1, 4], size: [5, 3, 2], color: robe }
  - part: Arm.L
    parent: Body
    transform:
      translate: [-1, 1, 4]
    voxels:
      - box: { min: [0, 0, 2], size: [2, 3, 5], color: robe }
      - box: { min: [0, 0, 0], size: [2, 2, 2], color: skin }
  - part: Arm.R
    parent: Body
    transform:
      translate: [8, 1, 4]
    voxels:
      - box: { min: [0, 0, 2], size: [2, 3, 5], color: robeDark }
      - box: { min: [0, 0, 0], size: [2, 2, 2], color: skin }
sockets:
  - socket: Hand.0
    parent: Arm.R
    transform: { translate: [1, 1, 0] }
  - socket: Hand.1
    parent: Arm.L
    transform: { translate: [1, 1, 0] }
  - socket: Back
    parent: Body
    transform: { translate: [4, 4, 8] }
animations:
  - clip: Idle
    duration: 1
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - { time: 0, value: [0, 0, 0] }
            - { time: 0.5, value: [0, 0, 0.1] }
            - { time: 1, value: [0, 0, 0] }

