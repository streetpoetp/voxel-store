  - clip: Hit
    duration: 0.35
    loop: false
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.45
              value: [0, 1.0, 0.2]
            - time: 1
              value: [0, 0, 0]
  - clip: Death
    duration: 0.75
    loop: false
    tracks:
      - part: Body
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 1
              value: [0, 0, 82]
        scale:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [1, 1, 1]
            - time: 1
              value: [1, 1, 0.72]
  - clip: Idle.V1
    duration: 1.176
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [-0.16, 0, 0.2]
            - time: 1
              value: [0, 0, 0]
  - clip: WalkForward.V1
    duration: 0.594
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
