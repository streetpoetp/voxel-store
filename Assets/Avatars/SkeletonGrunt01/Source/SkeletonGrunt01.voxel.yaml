name: SkeletonGrunt01
voxelsPerUnit: 8
assemblyOrigin:
  part: Body
parts:
  - part: Body
    voxels:
      - box: { min: [3, 1, 6], size: [2, 2, 6], color: boneShadow }
      - box: { min: [1, 1, 10], size: [6, 2, 1], color: boneLight }
      - box: { min: [1, 1, 8], size: [6, 2, 1], color: bone }
      - box: { min: [2, 1, 7], size: [4, 2, 1], color: boneLight }
      - box: { min: [2, 1, 5], size: [4, 2, 2], color: bone }
      - box: { min: [2, 0, 4], size: [4, 1, 2], color: cloth }
      - voxel: { at: [2, 0, 4], color: clothLight }
      - voxel: { at: [5, 0, 4], color: cloth }
      - box: { min: [2, 1, 0], size: [1, 2, 5], color: boneLight }
      - box: { min: [1, 0, 0], size: [2, 3, 1], color: bone }
      - box: { min: [5, 1, 0], size: [1, 2, 5], color: bone }
      - box: { min: [5, 0, 0], size: [2, 3, 1], color: boneShadow }

  - part: Head
    parent: Body
    transform:
      translate: [0, 0, 12]
    pivot: [4, 2, 0]
    voxels:
      - box: { min: [1, 0, 1], size: [6, 5, 5], color: bone }
      - box: { min: [0, 1, 2], size: [8, 3, 3], color: boneLight }
      - box: { min: [2, 0, 0], size: [4, 4, 2], color: bone }
      - box: { min: [1, 0, 3], size: [2, 1, 2], color: eyeCavity }
      - box: { min: [5, 0, 3], size: [2, 1, 2], color: eyeCavity }
      - voxel: { at: [2, 0, 4], color: eyeGlow }
      - voxel: { at: [5, 0, 4], color: eyeGlow }
      - voxel: { at: [3, 0, 2], color: eyeCavity }
      - voxel: { at: [4, 0, 2], color: eyeCavity }
      - voxel: { at: [2, 0, 1], color: boneShadow }
      - voxel: { at: [5, 0, 1], color: boneShadow }

  - part: Arm.L
    parent: Body
    transform:
      translate: [-2, 1, 5]
    voxels:
      - box: { min: [0, 0, 3], size: [2, 2, 4], color: bone }
      - box: { min: [0, 0, 2], size: [2, 2, 1], color: boneShadow }
      - box: { min: [0, 0, 0], size: [2, 2, 2], color: boneLight }
      - voxel: { at: [0, 0, 1], color: bone }

  - part: Arm.R
    parent: Body
    transform:
      translate: [8, 1, 5]
    voxels:
      - box: { min: [0, 0, 3], size: [2, 2, 4], color: boneShadow }
      - box: { min: [0, 0, 2], size: [2, 2, 1], color: bone }
      - box: { min: [0, 0, 0], size: [2, 2, 2], color: boneLight }
      - voxel: { at: [1, 0, 1], color: bone }

sockets:
  - socket: Hand.0
    parent: Arm.R
    transform:
      translate: [1, 1, 0]
  - socket: Hand.1
    parent: Arm.L
    transform:
      translate: [1, 1, 0]
  - socket: Back
    parent: Body
    transform:
      translate: [4, 3, 8]

animations:
  - clip: Idle
    duration: 1
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 0.15]
            - time: 1
              value: [0, 0, 0]
