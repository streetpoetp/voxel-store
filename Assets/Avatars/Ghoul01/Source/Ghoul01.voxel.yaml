animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 0.2]
            - time: 1
              value: [0, 0, 0]
