name: LichLord01
voxelsPerUnit: 8
assemblyOrigin:
  part: Body
parts:
  - part: Body
    voxels:
      - box: { min: [0, 1, 10], size: [12, 5, 3], color: robe }
      - box: { min: [1, 1, 8], size: [10, 5, 3], color: robeLight }
      - box: { min: [2, 1, 2], size: [8, 5, 7], color: robeDark }
      - box: { min: [1, 1, 0], size: [10, 5, 3], color: robe }
      - box: { min: [5, 0, 2], size: [2, 1, 8], color: gold }
      - voxel: { at: [5, 0, 4], color: robeDark }
      - voxel: { at: [6, 0, 7], color: robeDark }
  - part: Head
    parent: Body
    transform:
      translate: [3, 0, 12]
    voxels:
      - box: { min: [0, 0, 1], size: [6, 5, 5], color: robeDark }
      - box: { min: [1, 0, 1], size: [4, 1, 4], color: bone }
      - box: { min: [1, 0, 3], size: [1, 1, 1], color: void }
      - box: { min: [4, 0, 3], size: [1, 1, 1], color: void }
      - voxel: { at: [1, 0, 3], color: glow }
      - voxel: { at: [4, 0, 3], color: glow }
      - box: { min: [0, 1, 5], size: [1, 2, 4], color: gold }
      - box: { min: [2, 1, 6], size: [2, 2, 4], color: gold }
      - box: { min: [5, 1, 5], size: [1, 2, 4], color: gold }
  - part: Arm.L
    parent: Body
    transform:
      translate: [-1, 1, 5]
    voxels:
      - box: { min: [0, 0, 3], size: [2, 3, 5], color: robe }
      - box: { min: [0, 0, 0], size: [2, 2, 3], color: bone }
  - part: Arm.R
    parent: Body
    transform:
      translate: [11, 1, 5]
    voxels:
      - box: { min: [0, 0, 3], size: [2, 3, 5], color: robeDark }
      - box: { min: [0, 0, 0], size: [2, 2, 3], color: bone }
sockets:
  - socket: Hand.0
    parent: Arm.R
    transform: { translate: [1, 1, 0] }
  - socket: Hand.1
    parent: Arm.L
    transform: { translate: [1, 1, 0] }
  - socket: Back
    parent: Body
    transform: { translate: [6, 5, 10] }
animations:
  - clip: Idle
    duration: 1
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - { time: 0, value: [0, 0, 0] }
            - { time: 0.5, value: [0, 0, 0.08] }
            - { time: 1, value: [0, 0, 0] }
