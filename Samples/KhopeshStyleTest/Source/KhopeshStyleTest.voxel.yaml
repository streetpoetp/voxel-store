name: KhopeshStyleTest
voxelsPerUnit: 16
assemblyOrigin:
  part: Khopesh
parts:
  - part: Khopesh
    pivot: [7, 3, 7]
    voxels:
      # Pale ivory pommel and grip establish a material identity distinct from
      # the brown wooden handles used by the earlier weapon samples.
      - box: { min: [5, 1, 0], size: [5, 4, 3], color: ivory.dark }
      - box: { min: [6, 0, 1], size: [3, 1, 1], color: turquoise.mid }
      - box: { min: [7, 0, 1], size: [1, 1, 1], color: turquoise.light }
      - box: { min: [6, 2, 3], size: [3, 3, 7], color: ivory.mid }
      - box: { min: [6, 1, 3], size: [3, 1, 7], color: ivory.light }

      # Muted violet binding is deliberately irregular: two offset wrap groups
      # instead of the repeated green ring motif used by prior samples.
      - box: { min: [5, 1, 4], size: [4, 5, 2], color: violet.dark }
      - box: { min: [7, 1, 5], size: [3, 5, 2], color: violet.mid }
      - box: { min: [5, 1, 7], size: [4, 5, 2], color: violet.light }
      - box: { min: [7, 1, 8], size: [3, 5, 1], color: violet.mid }

      # Dark neck and small turquoise inset transition into the blade.
      - box: { min: [5, 1, 10], size: [5, 5, 3], color: obsidian.dark }
      - box: { min: [6, 0, 11], size: [3, 1, 1], color: turquoise.mid }
      - box: { min: [7, 0, 11], size: [1, 1, 1], color: turquoise.light }

      # Khopesh blade: it begins narrow above the grip, grows strongly toward
      # +X, then hooks back inward at the tip. Coarse steps are intentional.
      - box: { min: [6, 2, 13], size: [4, 3, 3], color: obsidian.black }
      - box: { min: [7, 2, 16], size: [5, 3, 3], color: obsidian.dark }
      - box: { min: [8, 2, 19], size: [6, 3, 3], color: obsidian.dark }
      - box: { min: [9, 2, 22], size: [7, 3, 3], color: obsidian.mid }
      - box: { min: [10, 2, 25], size: [8, 3, 3], color: obsidian.mid }

      # Forward-heavy hooked crown. The widest mass shifts left again at the
      # top so the silhouette bends rather than continuing as a straight saber.
      - box: { min: [9, 2, 28], size: [9, 3, 3], color: obsidian.mid }
      - box: { min: [8, 2, 31], size: [8, 3, 3], color: obsidian.dark }
      - box: { min: [7, 2, 34], size: [7, 3, 2], color: obsidian.dark }
      - box: { min: [6, 2, 36], size: [5, 3, 2], color: obsidian.black }
      - box: { min: [5, 2, 38], size: [3, 3, 1], color: obsidian.black }

      # One-voxel outer edge tracks the stepped cutting arc. It remains muted
      # gray rather than bright silver so the weapon stays visually obsidian.
      - box: { min: [10, 1, 16], size: [1, 1, 3], color: obsidian.edge }
      - box: { min: [12, 1, 19], size: [1, 1, 3], color: obsidian.edge }
      - box: { min: [14, 1, 22], size: [1, 1, 3], color: obsidian.edge }
      - box: { min: [16, 1, 25], size: [1, 1, 3], color: obsidian.edge }
      - box: { min: [17, 1, 28], size: [1, 1, 3], color: obsidian.edge }
      - box: { min: [15, 1, 31], size: [1, 1, 3], color: obsidian.edge }
      - box: { min: [13, 1, 34], size: [1, 1, 2], color: obsidian.edge }
      - box: { min: [10, 1, 36], size: [1, 1, 2], color: obsidian.edge }
      - box: { min: [7, 1, 38], size: [1, 1, 1], color: obsidian.edge }

      # Subtle inner ridge prevents the blade from reading as a flat slab.
      - box: { min: [8, 0, 18], size: [2, 1, 8], color: obsidian.mid }
      - box: { min: [10, 0, 26], size: [3, 1, 7], color: obsidian.dark }
