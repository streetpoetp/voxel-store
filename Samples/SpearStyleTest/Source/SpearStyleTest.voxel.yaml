name: SpearStyleTest
voxelsPerUnit: 16
assemblyOrigin:
  part: Spear
parts:
  - part: Spear
    pivot: [5, 3, 10]
    voxels:
      # Butt cap: small metal block with a restrained bronze face accent.
      - box: { min: [3, 1, 0], size: [5, 4, 3], color: steel.dark }
      - box: { min: [4, 0, 1], size: [3, 1, 1], color: steel.mid }
      - box: { min: [5, 0, 1], size: [1, 1, 1], color: bronze.light }

      # Continuous wood shaft.
      - box: { min: [4, 2, 3], size: [3, 3, 24], color: wood.mid }
      - box: { min: [4, 1, 3], size: [3, 1, 24], color: wood.light }
      - box: { min: [4, 5, 3], size: [3, 1, 24], color: wood.dark }

      # Three separated grip-wrap bands around the lower-middle shaft.
      - box: { min: [3, 1, 7], size: [5, 5, 2], color: wrap.dark }
      - box: { min: [3, 1, 11], size: [5, 5, 2], color: wrap.green }
      - box: { min: [3, 1, 15], size: [5, 5, 2], color: wrap.light }
      - box: { min: [4, 0, 8], size: [3, 1, 1], color: wrap.green }
      - box: { min: [4, 0, 12], size: [3, 1, 1], color: wrap.light }
      - box: { min: [4, 0, 16], size: [3, 1, 1], color: wrap.green }

      # Metal socket/collar below the blade.
      - box: { min: [3, 1, 25], size: [5, 5, 3], color: steel.dark }
      - box: { min: [4, 0, 26], size: [3, 1, 1], color: bronze.mid }
      - box: { min: [5, 0, 26], size: [1, 1, 1], color: bronze.light }

      # Long leaf-shaped spearhead. The blade swells just above the socket,
      # then narrows through several stepped stages to a crisp central tip.
      - box: { min: [3, 2, 28], size: [5, 3, 2], color: steel.dark }
      - box: { min: [2, 2, 30], size: [7, 3, 3], color: steel.mid }
      - box: { min: [1, 2, 33], size: [9, 3, 2], color: steel.mid }
      - box: { min: [2, 2, 35], size: [7, 3, 2], color: steel.light }
      - box: { min: [3, 2, 37], size: [5, 3, 2], color: steel.light }
      - box: { min: [4, 2, 39], size: [3, 3, 2], color: steel.edge }
      - box: { min: [5, 2, 41], size: [1, 3, 1], color: steel.edge }

      # Raised center ridge gives the broad head structural depth.
      - box: { min: [4, 1, 29], size: [3, 1, 10], color: steel.light }
      - box: { min: [5, 0, 31], size: [1, 1, 8], color: steel.edge }

      # Bright stepped cutting edges on both sides.
      - box: { min: [1, 1, 33], size: [1, 1, 2], color: steel.light }
      - box: { min: [2, 1, 35], size: [1, 1, 2], color: steel.edge }
      - box: { min: [3, 1, 37], size: [1, 1, 2], color: steel.edge }
      - box: { min: [9, 1, 33], size: [1, 1, 2], color: steel.light }
      - box: { min: [8, 1, 35], size: [1, 1, 2], color: steel.edge }
      - box: { min: [7, 1, 37], size: [1, 1, 2], color: steel.edge }
