name: WarHammerStyleTest
voxelsPerUnit: 16
assemblyOrigin:
  part: WarHammer
parts:
  - part: WarHammer
    pivot: [8, 3, 8]
    voxels:
      # Dark metal pommel with a small bronze face accent.
      - box: { min: [6, 1, 0], size: [5, 4, 3], color: steel.dark }
      - box: { min: [7, 0, 1], size: [3, 1, 1], color: steel.mid }
      - box: { min: [8, 0, 1], size: [1, 1, 1], color: bronze.light }

      # Continuous chunky wood shaft.
      - box: { min: [7, 2, 3], size: [3, 3, 17], color: wood.mid }
      - box: { min: [7, 1, 3], size: [3, 1, 17], color: wood.light }
      - box: { min: [7, 5, 3], size: [3, 1, 17], color: wood.dark }

      # Three separated green grip-wrap bands.
      - box: { min: [6, 1, 4], size: [5, 5, 2], color: wrap.dark }
      - box: { min: [6, 1, 8], size: [5, 5, 2], color: wrap.green }
      - box: { min: [6, 1, 12], size: [5, 5, 2], color: wrap.light }
      - box: { min: [7, 0, 5], size: [3, 1, 1], color: wrap.green }
      - box: { min: [7, 0, 9], size: [3, 1, 1], color: wrap.light }
      - box: { min: [7, 0, 13], size: [3, 1, 1], color: wrap.green }

      # Upper grip transition and metal collar.
      - box: { min: [6, 1, 15], size: [5, 5, 4], color: wood.dark }
      - box: { min: [7, 0, 16], size: [3, 1, 2], color: wood.mid }
      - box: { min: [5, 1, 19], size: [7, 5, 3], color: steel.mid }
      - box: { min: [6, 0, 20], size: [5, 1, 1], color: steel.light }

      # Heavy dark central head wrapped around the shaft.
      - box: { min: [5, 1, 21], size: [7, 5, 6], color: head.dark }
      - box: { min: [6, 0, 22], size: [5, 1, 4], color: head.mid }
      - box: { min: [6, 6, 22], size: [5, 1, 4], color: steel.dark }

      # Broad square striking face on +X with a readable bright bevel.
      - box: { min: [12, 1, 20], size: [5, 5, 8], color: head.mid }
      - box: { min: [17, 2, 21], size: [2, 3, 6], color: steel.mid }
      - box: { min: [19, 2, 22], size: [1, 3, 4], color: steel.light }
      - box: { min: [15, 0, 21], size: [3, 1, 6], color: steel.light }
      - box: { min: [15, 6, 21], size: [3, 1, 6], color: steel.dark }

      # Short stepped rear pick on -X. A tall root and two narrowing stages make
      # the asymmetric silhouette obvious without turning it into a thin needle.
      - box: { min: [2, 2, 21], size: [3, 3, 6], color: head.mid }
      - box: { min: [1, 2, 22], size: [2, 3, 4], color: steel.mid }
      - box: { min: [0, 2, 23], size: [1, 3, 2], color: steel.light }

      # Small bronze inset breaks the dark head mass without dominating it.
      - box: { min: [8, 0, 23], size: [2, 1, 2], color: bronze.mid }
      - box: { min: [8, 0, 24], size: [1, 1, 1], color: bronze.light }
