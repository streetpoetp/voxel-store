name: AxeStyleTest
voxelsPerUnit: 80
assemblyOrigin:
  part: Axe
parts:
  - part: Axe
    pivot: [38, 7, 42]
    voxels:
      # Pommel: square gray counterweight from the accepted target.
      - box: { min: [29, 2, 0], size: [18, 10, 10], color: steel.dark }
      - box: { min: [31, 1, 1], size: [14, 1, 8], color: steel.mid }
      - box: { min: [31, 12, 1], size: [14, 1, 8], color: steel.light }

      # Wood handle. One continuous rigid shaft, segmented visually by wraps.
      - box: { min: [33, 4, 10], size: [10, 7, 66], color: wood.mid }
      - box: { min: [34, 3, 10], size: [8, 1, 66], color: wood.light }
      - box: { min: [34, 11, 10], size: [8, 1, 66], color: wood.dark }

      # Green grip wraps visible in the target.
      - box: { min: [31, 2, 17], size: [14, 11, 6], color: wrap.lime }
      - box: { min: [32, 1, 18], size: [12, 1, 4], color: wrap.light }
      - box: { min: [31, 2, 28], size: [14, 11, 7], color: wrap.green }
      - box: { min: [32, 1, 29], size: [12, 1, 5], color: wrap.dark }
      - box: { min: [31, 2, 41], size: [14, 11, 7], color: wrap.dark }
      - box: { min: [32, 1, 42], size: [12, 1, 5], color: wrap.green }
      - box: { min: [31, 2, 57], size: [14, 11, 7], color: wrap.lime }
      - box: { min: [32, 1, 58], size: [12, 1, 5], color: wrap.light }

      # Gray collar directly below the head.
      - box: { min: [29, 2, 68], size: [18, 11, 9], color: steel.mid }
      - box: { min: [31, 1, 69], size: [14, 1, 7], color: steel.light }
      - box: { min: [31, 13, 69], size: [14, 1, 7], color: steel.dark }

      # Dark central axe eye/head.
      - box: { min: [22, 2, 76], size: [32, 11, 25], color: head.dark }
      - box: { min: [24, 1, 78], size: [28, 1, 21], color: head.mid }
      - box: { min: [24, 13, 78], size: [28, 1, 21], color: head.darker }

      # Handle continues through and above the head.
      - box: { min: [33, 4, 100], size: [10, 7, 8], color: wood.mid }
      - box: { min: [34, 3, 101], size: [8, 1, 7], color: wood.light }

      # Gold square inset on the accepted front face.
      - box: { min: [31, 0, 84], size: [14, 2, 12], color: gold.mid }
      - box: { min: [35, 0, 88], size: [7, 1, 5], color: gold.light }

      # Dark poll on the non-blade side from FRONT/BACK target views.
      - box: { min: [14, 3, 80], size: [8, 9, 17], color: head.darker }
      - box: { min: [10, 4, 83], size: [6, 7, 11], color: steel.dark }
      - box: { min: [9, 3, 86], size: [3, 9, 6], color: steel.mid }

      # Single broad right blade. Stepped crescent span is intentionally much taller than the central head.
      - box: { min: [52, 3, 72], size: [10, 9, 32], color: blade.dark }
      - box: { min: [60, 3, 67], size: [10, 9, 42], color: blade.mid }
      - box: { min: [69, 3, 70], size: [10, 9, 36], color: blade.light }
      - box: { min: [78, 3, 76], size: [8, 9, 24], color: blade.light }
      - box: { min: [85, 3, 82], size: [5, 9, 12], color: blade.edge }

      # Bright stepped cutting edge plus upper/lower shoulders create the target's crescent profile.
      - box: { min: [64, 2, 105], size: [10, 1, 5], color: blade.light }
      - box: { min: [73, 2, 102], size: [9, 1, 5], color: blade.edge }
      - box: { min: [64, 2, 64], size: [10, 1, 6], color: blade.light }
      - box: { min: [73, 2, 69], size: [9, 1, 5], color: blade.edge }
      - box: { min: [82, 2, 79], size: [6, 1, 18], color: blade.edge }
      # Dark wedge visually joins blade root to the rectangular eye.
      - box: { min: [50, 4, 81], size: [8, 7, 14], color: head.darker }