name: KnifeStyleTest
voxelsPerUnit: 12
assemblyOrigin:
  part: Knife
parts:
  - part: Knife
    pivot: [5, 1, 4]
    voxels:
      # Pommel: broad brown block with centered gold face inset.
      - box: { min: [3, 1, 0], size: [5, 2, 3], color: wood.dark }
      - box: { min: [4, 0, 1], size: [3, 1, 1], color: wood.mid }
      - box: { min: [5, 0, 1], size: [1, 1, 1], color: gold.light }

      # Brown grip core.
      - box: { min: [4, 1, 3], size: [3, 2, 5], color: wood.dark }
      - box: { min: [5, 0, 3], size: [1, 1, 5], color: wood.mid }

      # Three chunky diagonal/stepped green wrap groups.
      - box: { min: [3, 0, 3], size: [2, 3, 1], color: wrap.dark }
      - box: { min: [4, 0, 4], size: [2, 3, 1], color: wrap.green }
      - box: { min: [5, 0, 5], size: [2, 3, 1], color: wrap.light }
      - box: { min: [5, 0, 5], size: [2, 3, 1], color: wrap.light }
      - box: { min: [4, 0, 6], size: [2, 3, 1], color: wrap.green }
      - box: { min: [3, 0, 7], size: [2, 3, 1], color: wrap.dark }

      # Wide brown guard with small centered gold front inset.
      - box: { min: [2, 1, 8], size: [8, 2, 2], color: wood.dark }
      - box: { min: [3, 0, 8], size: [6, 1, 1], color: wood.mid }
      - box: { min: [5, 0, 8], size: [2, 1, 1], color: gold.mid }
      - box: { min: [6, 0, 8], size: [1, 1, 1], color: gold.light }

      # Broad asymmetric stepped blade body; every segment overlaps/touches at VPU12.
      - box: { min: [3, 1, 10], size: [5, 2, 4], color: steel.dark }
      - box: { min: [4, 1, 13], size: [4, 2, 3], color: steel.mid }
      - box: { min: [5, 1, 15], size: [3, 2, 2], color: steel.mid }
      - box: { min: [6, 1, 17], size: [2, 2, 1], color: steel.light }

      # Left/spine steps.
      - box: { min: [2, 1, 11], size: [1, 2, 2], color: steel.dark }
      - box: { min: [3, 1, 14], size: [1, 2, 1], color: steel.dark }

      # Light bevel and intentional one-voxel bright cutting edge.
      - box: { min: [7, 0, 10], size: [1, 3, 4], color: steel.light }
      - box: { min: [7, 0, 14], size: [1, 3, 2], color: steel.light }
      - box: { min: [8, 0, 10], size: [1, 3, 4], color: steel.edge }
      - box: { min: [8, 0, 14], size: [1, 3, 2], color: steel.edge }
      - box: { min: [7, 0, 16], size: [1, 3, 1], color: steel.edge }
      - box: { min: [6, 0, 17], size: [1, 3, 1], color: steel.edge }
