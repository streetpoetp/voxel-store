<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f4f2ec"/>
  <g font-family="Arial, sans-serif" fill="#20252a">
    <text x="40" y="50" font-size="28" font-weight="700">FoundationGuard01 — Composition Sheet</text>
    <text x="40" y="82" font-size="16">Target Bounds: 12 × 8 × 16 voxels · reference pose: relaxed upright</text>
    <text x="40" y="125" font-size="20" font-weight="700">HERO VIEW</text>
    <g transform="translate(90 150)">
      <rect x="80" y="150" width="150" height="210" fill="#4A5A68"/>
      <rect x="115" y="90" width="80" height="70" fill="#D9A273"/>
      <rect x="35" y="165" width="45" height="150" fill="#27313C" transform="rotate(-8 57 165)"/>
      <rect x="230" y="165" width="45" height="150" fill="#27313C" transform="rotate(8 252 165)"/>
      <rect x="105" y="210" width="100" height="120" fill="#6E4930" opacity="0.45"/>
    </g>
    <text x="430" y="125" font-size="20" font-weight="700">EXPLICIT PART MANIFEST</text>
    <text x="430" y="165" font-size="18">Body — torso/base assembly</text>
    <text x="430" y="198" font-size="18">Head — articulated head</text>
    <text x="430" y="231" font-size="18">Arm.L — left articulated arm</text>
    <text x="430" y="264" font-size="18">Arm.R — right articulated arm</text>
    <text x="430" y="297" font-size="18">BackPlate — rigid rear mount plate</text>
    <text x="40" y="470" font-size="20" font-weight="700">EXPLODED COMPOSITION VIEW</text>
    <g transform="translate(50 500)">
      <rect x="0" y="40" width="120" height="160" fill="#4A5A68"/><text x="25" y="225" font-size="15">Body</text>
      <rect x="180" y="70" width="70" height="70" fill="#D9A273"/><text x="192" y="165" font-size="15">Head</text>
      <rect x="310" y="50" width="35" height="150" fill="#27313C"/><text x="300" y="225" font-size="15">Arm.L</text>
      <rect x="420" y="50" width="35" height="150" fill="#27313C"/><text x="410" y="225" font-size="15">Arm.R</text>
      <rect x="530" y="70" width="100" height="120" fill="#6E4930"/><text x="542" y="215" font-size="15">BackPlate</text>
    </g>
    <text x="760" y="470" font-size="20" font-weight="700">ASSEMBLY RELATIONSHIPS + PIVOTS + REFERENCE POSE</text>
    <text x="760" y="510" font-size="16">Body → Head (top)</text>
    <text x="760" y="540" font-size="16">Body → Arm.L / Arm.R (shoulder hinges)</text>
    <text x="760" y="570" font-size="16">Body → BackPlate (rear rigid mount)</text>
    <text x="760" y="610" font-size="16">Arms hang slightly outward in target pose.</text>
    <text x="760" y="640" font-size="16">Hand and Back attachment intent is visual only here.</text>
  </g>
</svg>
