name: FoundationGuard01
voxelsPerUnit: 8
assemblyOrigin:
  part: Body
parts:
  - part: Body
    pivot: [4, 2, 0]
    voxels:
      - box: { min: [0, 0, 0], size: [8, 4, 10], color: cloth.mid }
      - box: { min: [1, 0, 7], size: [6, 1, 3], color: cloth.light }
      - box: { min: [2, 3, 2], size: [4, 1, 5], color: leather.dark }
  - part: Head
    parent: Body
    transform:
      translate: [2, 0, 10]
    pivot: [2, 2, 0]
    voxels:
      - box: { min: [0, 0, 0], size: [4, 4, 4], color: skin }
      - box: { min: [0, 0, 3], size: [4, 4, 1], color: metal.dark }
  - part: Arm.L
    parent: Body
    transform:
      translate: [-2, 1, 7]
      rotate: [0, 0, -8]
    pivot: [1, 1, 5]
    voxels:
      - box: { min: [0, 0, 0], size: [2, 2, 6], color: cloth.dark }
      - box: { min: [0, 0, 0], size: [2, 2, 2], color: skin }
  - part: Arm.R
    parent: Body
    transform:
      translate: [8, 1, 7]
      rotate: [0, 0, 8]
    pivot: [1, 1, 5]
    voxels:
      - box: { min: [0, 0, 0], size: [2, 2, 6], color: cloth.dark }
      - box: { min: [0, 0, 0], size: [2, 2, 2], color: skin }
  - part: BackPlate
    parent: Body
    transform:
      translate: [1, 4, 3]
    pivot: [3, 0, 3]
    voxels:
      - box: { min: [0, 0, 0], size: [6, 1, 7], color: leather }
sockets:
  - socket: Hand.R
    parent: Arm.R
    transform:
      translate: [1, 1, 0]
  - socket: Hand.L
    parent: Arm.L
    transform:
      translate: [1, 1, 0]
  - socket: Back
    parent: BackPlate
    transform:
      translate: [3, 1, 3]
animations:
  - clip: Idle
    duration: 1.2
    loop: true
    tracks:
      - part: Body
        position:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 0, 0.2]
            - time: 1
              value: [0, 0, 0]
      - part: Arm.R
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, 3, 2]
            - time: 1
              value: [0, 0, 0]
      - part: Arm.L
        rotation:
          interpolation: smoothstep
          keys:
            - time: 0
              value: [0, 0, 0]
            - time: 0.5
              value: [0, -3, -2]
            - time: 1
              value: [0, 0, 0]
